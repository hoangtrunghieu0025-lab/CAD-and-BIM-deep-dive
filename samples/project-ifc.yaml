# Dự án mẫu 2: một file IFC (tầng lấy từ IfcBuildingStorey). Mẫu IFC không có IfcMapConversion nên dùng georeference của project.
name: sample-building-ifc
mapping: {layers: ../config/layer_mapping.yaml, tags: ../config/tag_mapping.yaml}
inputs:
  - {kind: ifc, file: sample-building.ifc}
georeference:
  crs: "EPSG:3405"
  origin: [588000.0, 2325000.0]
  rotation_deg: 0.0
  scale: 1.0
venue: {name: "Toà nhà mẫu", category: businesscampus, buffer_m: 1.0}
address: {address: "1 Phố Ví Dụ", locality: "Hà Nội", country: "VN"}
